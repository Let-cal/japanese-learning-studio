name: Product foundation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-sample:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Install pinned local toolchain
        working-directory: tools/toolchain
        run: npm ci --ignore-scripts
      - name: Frozen product install
        run: node tools/toolchain/node_modules/pnpm/bin/pnpm.mjs install --frozen-lockfile --ignore-scripts
      - name: Generate route types
        run: node node_modules/next/dist/bin/next typegen
      - name: JavaScript config lint
        run: node tools/toolchain/node_modules/pnpm/bin/pnpm.mjs lint
      - name: Strict TypeScript check
        run: node tools/toolchain/node_modules/pnpm/bin/pnpm.mjs typecheck
      - name: Domain and contract tests
        run: node tools/toolchain/node_modules/pnpm/bin/pnpm.mjs test
      - name: Validate core API document and freshness
        run: node tools/toolchain/node_modules/pnpm/bin/pnpm.mjs api:check
      - name: Production build
        run: node tools/toolchain/node_modules/pnpm/bin/pnpm.mjs build
      - name: Install Chromium for local fixture browser checks
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Sample browser behavior and accessibility checks
        run: node tools/toolchain/node_modules/pnpm/bin/pnpm.mjs test:e2e
      - name: Dependency advisories
        run: node tools/toolchain/node_modules/pnpm/bin/pnpm.mjs audit

  # Optional correctness proof; source draft remains local until the owner approves this exact diff.
  # This job is additional evidence and does not change existing required-check configuration.
  command-postgres:
    needs: public-sample
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      JLS_COMMAND_PROOF: owned-disposable
    services:
      postgres:
        image: postgres:17.11-bookworm@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
        env:
          POSTGRES_DB: jls_command_fixture
          POSTGRES_USER: command_fixture_admin
          POSTGRES_PASSWORD: disposable_command_fixture_only
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U command_fixture_admin -d jls_command_fixture"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Install pinned local toolchain
        working-directory: tools/toolchain
        run: npm ci --ignore-scripts
      - name: Frozen product install
        run: node tools/toolchain/node_modules/pnpm/bin/pnpm.mjs install --frozen-lockfile --ignore-scripts
      - name: Owned disposable Postgres command proof
        run: node tools/toolchain/node_modules/pnpm/bin/pnpm.mjs test:postgres
